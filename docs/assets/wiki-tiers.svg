<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="The wiki's memory tiers: L1 session notes and the L2 project map are always injected at wake-up; L3 recall fetches on demand with every miss logged; promotion into the global tier of durable knowledge is gated, never automatic.">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <text x="460" y="28" text-anchor="middle" fill="#8b949e" font-size="14" font-style="italic">what a session sees, and what it earns</text>

  <!-- L1 -->
  <rect x="30" y="60" width="270" height="110" rx="12" fill="#56b4e9"/>
  <text x="165" y="90" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600">L1 — session notes</text>
  <text x="165" y="114" text-anchor="middle" fill="#ffffff" font-size="12" opacity="0.92">always injected at wake-up</text>
  <text x="165" y="132" text-anchor="middle" fill="#ffffff" font-size="12" opacity="0.92">quarantine-bannered until reviewed</text>
  <text x="165" y="150" text-anchor="middle" fill="#ffffff" font-size="12" opacity="0.92">the distiller's raw material</text>

  <!-- L2 -->
  <rect x="325" y="60" width="270" height="110" rx="12" fill="#0072b2"/>
  <text x="460" y="90" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600">L2 — project map</text>
  <text x="460" y="114" text-anchor="middle" fill="#ffffff" font-size="12" opacity="0.92">compact facts + pointers,</text>
  <text x="460" y="132" text-anchor="middle" fill="#ffffff" font-size="12" opacity="0.92">always injected — a map,</text>
  <text x="460" y="150" text-anchor="middle" fill="#ffffff" font-size="12" opacity="0.92">never the territory</text>

  <!-- L3 -->
  <rect x="620" y="60" width="270" height="110" rx="12" fill="#009e73"/>
  <text x="755" y="90" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600">L3 — recall</text>
  <text x="755" y="114" text-anchor="middle" fill="#ffffff" font-size="12" opacity="0.92">on-demand fetch,</text>
  <text x="755" y="132" text-anchor="middle" fill="#ffffff" font-size="12" opacity="0.92">every miss logged —</text>
  <text x="755" y="150" text-anchor="middle" fill="#ffffff" font-size="12" opacity="0.92">the hit rate is honest</text>

  <!-- promotion arrow -->
  <line x1="460" y1="170" x2="460" y2="235" stroke="#8b949e" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="475" y="210" fill="#8b949e" font-size="13" font-style="italic">promotion — gated, never automatic</text>

  <!-- global tier -->
  <rect x="180" y="242" width="560" height="90" rx="12" fill="#d55e00"/>
  <text x="460" y="274" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600">global tier — typed, durable knowledge</text>
  <text x="460" y="300" text-anchor="middle" fill="#ffffff" font-size="12" opacity="0.92">decisions · patterns · research · lessons · identity</text>
  <text x="460" y="318" text-anchor="middle" fill="#ffffff" font-size="12" opacity="0.92">every page trust-stamped: user / model / foreign</text>
</svg>
